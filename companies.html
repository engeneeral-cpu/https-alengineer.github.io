<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companies — Market Analysis</title><meta name="description" content="Explore the Indian company universe across NSE and BSE."><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="logo">M</div><div><b>Market Analysis</b><span>NSE & BSE Intelligence</span></div></div><nav><a href="index.html">Dashboard</a><a href="companies.html">Companies</a><a href="index.html#compare">Compare</a><a href="index.html#watchlist">Watchlist</a></nav><a class="theme" href="index.html">⌂</a></header><main><section class="section"><span class="eyebrow">COMPANY UNIVERSE</span><h1>Indian listed companies</h1><p>Search the dashboard dataset by company, symbol or sector.</p><div class="search"><span>⌕</span><input id="companySearch" placeholder="Search company, symbol or sector..."><button id="clearBtn">Clear</button></div><div id="companyGrid" class="company-grid"></div></section></main><footer><div><b>Market Analysis</b><p>NSE & BSE company intelligence.</p></div><span>Demo research data only.</span></footer><script src="app.js"></script><script>const input=document.getElementById('companySearch');const original=window.render;input.addEventListener('input',()=>{const q=input.value.toLowerCase();window.render(companies.filter(c=>(c.name+' '+c.ticker+' '+c.sector).toLowerCase().includes(q)))});document.getElementById('clearBtn').onclick=()=>{input.value='';window.render(companies)};</script></body></html>
