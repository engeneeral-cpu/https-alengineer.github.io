name: Site check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required pages
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f companies.html
          test -f company.html
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          echo 'Market Analysis static site checks passed.'
