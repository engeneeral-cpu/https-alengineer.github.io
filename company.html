<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Profile — Market Analysis</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="logo">M</div><div><b>Market Analysis</b><span>NSE & BSE Intelligence</span></div></div><nav><a href="index.html">Dashboard</a><a href="companies.html">Companies</a><a href="index.html#compare">Compare</a></nav><a class="theme" href="index.html">⌂</a></header><main><section class="section" id="profile"></section></main><footer><div><b>Market Analysis</b><p>Company intelligence dashboard.</p></div><span>Demo research data only. Not investment advice.</span></footer><script src="app.js"></script><script>const t=new URLSearchParams(location.search).get('symbol')||'RELIANCE';const c=companies.find(x=>x.ticker.toUpperCase()===t.toUpperCase())||companies[0];document.title=c.name+' — Market Analysis';document.getElementById('profile').innerHTML=`<span class="eyebrow">NSE · ${c.ticker}</span><h1>${c.name}</h1><p>${c.sector}</p><div class="stats"><div><span>Displayed price</span><b>${c.price}</b><small class="up">${c.change} today</small></div><div><span>P/E</span><b>${c.pe}</b><small>Valuation metric</small></div><div><span>ROE</span><b>${c.roe}</b><small>Profitability metric</small></div><div><span>Growth</span><b>${c.growth}</b><small>Dashboard estimate</small></div></div><div class="ai-card" style="margin-top:24px"><span class="eyebrow">RESEARCH VIEW</span><h2>Company overview</h2><p>This profile presents the figures currently available in the dashboard dataset. Live exchange prices, filings, news and fundamentals require verified data feeds.</p><a class="ghost" href="index.html#compare">Compare this company →</a></div>`;</script></body></html>
